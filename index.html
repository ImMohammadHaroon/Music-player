<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Dark Music Player</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<div class="container">
		<aside class="playlist">
			<h2>Playlist</h2>
			<ul id="playlist-list"></ul>
			<label for="file-input" class="upload-btn">
				<span class="icon">&#128190;</span> Upload Music
			</label>
			<input type="file" id="file-input" accept="audio/*" multiple style="display:none;">
		</aside>
		<main class="player">
			<div class="vinyl-container">
				<div class="vinyl-disc" id="vinyl-disc">
					<div class="vinyl-grooves"></div>
					<div class="vinyl-center"></div>
				</div>
			</div>
			<div class="progress-bar-container">
				<input type="range" id="progress-bar" min="0" value="0" step="0.01">
			</div>
			<div class="player-controls">
				<button id="prev" title="Previous">
					<span class="icon">&#9664;&#9664;</span>
				</button>
				<button id="play" title="Play/Pause">
					<span class="icon">&#9654;</span>
				</button>
				<button id="next" title="Next">
					<span class="icon">&#9654;&#9654;</span>
				</button>
			</div>
			<div class="track-info">
				<span id="track-title">No track selected</span>
			</div>
			<div class="time-info">
				<span id="current-time">00:00</span> / <span id="total-duration">00:00</span>
			</div>
			<audio id="audio" controls style="display:none;"></audio>
		</main>
	</div>
	<script src="script.js"></script>
</body>
</html>
